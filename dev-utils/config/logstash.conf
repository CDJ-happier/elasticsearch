input {
  file {
    path => [
      "/Users/cdj/code/work/elasticsearch/dev-utils/logs/es*/es*-node*/es*.log"
    ]
    start_position => "beginning"
    codec => multiline {
      pattern => "^\["
      negate => true
      what => "previous"
    }
    tags => ["es_runlog"]
  }
}

filter {
  # 解析ES日志格式
  grok {
    match => {
      "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\]\[%{LOGLEVEL:loglevel}%{SPACE}\]\[%{DATA:logger}%{SPACE}\] \[%{DATA:node}\]%{GREEDYDATA:message}"
    }
    overwrite => ["message"]
  }

  # 提取组件信息（如o.e.n.Node）
  if [logger] {
    grok {
      match => { "logger" => "%{WORD:component}\.%{DATA:subcomponent}" }
    }
  }

  # 将解析出的时间戳设置为 @timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # 移除临时字段
  mutate {
    remove_field => ["timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "es-runlog"
    # 如果启用了安全特性，请取消注释以下行并提供凭据
    # user => "your_username"
    # password => "your_password"
  }

  # 调试时可以取消注释以下行以在控制台查看输出
  # stdout { codec => rubydebug }
}
